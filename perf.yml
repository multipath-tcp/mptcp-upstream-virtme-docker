# This is just a sample file

test1:
  name: "Test 1"
  timeout_s: 3600
  bridges:
    - name: "br0"
      rate_mbit: 123
      delay_ms: 12
      loss_pc: 1
    - name: "br1"
      rate_mbit: 321
      delay_ms: 21
      loss_pc: 2
  stats:
    pre:
      - name: "nstat_reset"
        run: "nstat"
      - name: "uname"
        target: "client"
        run: "uname -a"
    post:
      - name: "nstat"
        run: "nstat | grep Tcp"
    all:
      - name: "proc_net_dev"
        run: "cat /proc/net/dev"
  test:
    - name: "greeting"
      client: 'echo "Hello from client: $HOSTNAME"'
      server: |-
        echo "Hello from server: $HOSTNAME"
    - name: "welcoming"
      all:
        run: 'sleep 10'
        timeout_s: 1
        ignore_err: True
  validation:
    - name: "proc_net_dev"
      run: |-
        test -s stats/client/pre/proc_net_dev
        test -s stats/client/post/proc_net_dev
        test -s stats/server/pre/proc_net_dev
        test -s stats/server/post/proc_net_dev
