# This is just a sample file

test1:
  name: "Test 1"
  timeout_s: 3600
  bridges:
    br0:
      rate_mbit: 123
      delay_ms: 12
      loss_pc: 1
    br1:
      rate_mbit: 321
      delay_ms: 21
      loss_pc: 2
  stats:
    pre:
      nstat_reset: "nstat"
      client:
        uname: "uname -a"
    post:
      nstat: "nstat | grep Tcp"
    all:
      proc_net_dev: "cat /proc/net/dev"
  test:
    greeting:
      client: 'echo "Hello from client: $HOSTNAME"'
      server: |
        echo "Hello from server: $HOSTNAME"
    welcoming:
      all:
        run: 'sleep 10'
        timeout_s: 1
        ignore_err: True
