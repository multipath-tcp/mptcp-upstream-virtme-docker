# yaml-language-server: $schema=./perf.schema
# yamllint disable rule:line-length
---

global:
  bridges_hw_accel: false
  dstat:
    offset_end: 1
    offset_start: 2
  stats:
    post:
      - name: "nstat"
        run: "nstat -jz"
      - name: "mptcp"
        run: "ip -j mptcp endpoint show"
    pre:
      - name: "nstat"
        run: "nstat -n"
  timeout_s: 900
name: "sched-bidir"
tests:
  - bridges:
      - delay_ms: 7.5
        max_latency_ms: 22.5
        name: "br0"
        rate_mbit: 29
      - delay_ms: 7.5
        max_latency_ms: 22.5
        name: "br1"
        rate_mbit: 29
    name: "balanced bidir"
    regression:
      global:
        direction: "lower"
        history_max_n: 50
        min_diff_pc: 1
      steps:
        - file: "stats/dstat.json"
          json_field:
            - "client"
            - "net/eth0:recv"
            - "mean"
          name: "Download primary path"
        - file: "stats/dstat.json"
          json_field:
            - "client"
            - "net/eth1:recv"
            - "mean"
          name: "Download secondary path"
        - file: "stats/dstat.json"
          json_field:
            - "client"
            - "net/total:recv"
            - "mean"
          name: "Download total"
        - file: "stats/dstat.json"
          json_field:
            - "server"
            - "net/eth0:recv"
            - "mean"
          name: "Upload primary path"
        - file: "stats/dstat.json"
          json_field:
            - "server"
            - "net/eth1:recv"
            - "mean"
          name: "Upload secondary path"
        - file: "stats/dstat.json"
          json_field:
            - "server"
            - "net/total:recv"
            - "mean"
          name: "Upload total"
        - direction: "higher"
          file: "stats/server/post/nstat"
          holm_bonferroni: false
          json_field:
            - "kernel"
            - "MPTcpExtMPTCPRetrans"
          min_diff: 20
          min_diff_pc: 50
          name: "Download: MPTCP retransmissions"
        - direction: "higher"
          file: "stats/client/post/nstat"
          holm_bonferroni: false
          json_field:
            - "kernel"
            - "MPTcpExtDuplicateData"
          min_diff: 100
          min_diff_pc: 50
          name: "Download: Duplicated data"
        - direction: "higher"
          file: "stats/client/post/nstat"
          holm_bonferroni: false
          json_field:
            - "kernel"
            - "MPTcpExtNoDSSInWindow"
          min_diff: 10
          min_diff_pc: 50
          name: "Download: Data beyond the window"
        - direction: "higher"
          file: "stats/client/post/nstat"
          holm_bonferroni: false
          json_field:
            - "kernel"
            - "TcpExtTCPZeroWindowDrop"
          min_diff: 5
          min_diff_pc: 50
          name: "Download: Zero window drops"
        - direction: "higher"
          file: "stats/client/post/nstat"
          holm_bonferroni: false
          json_field:
            - "kernel"
            - "MPTcpExtMPTCPRetrans"
          min_diff: 20
          min_diff_pc: 50
          name: "Upload: MPTCP retransmissions"
        - direction: "higher"
