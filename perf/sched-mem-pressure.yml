# Generated from sched-mem-pressure.jsonnet by gen.sh: do not edit
# yaml-language-server: $schema=./perf.schema
# yamllint disable rule:line-length
---

global:
  bridges_hw_accel: false
  dstat:
    offset_end: 1
    offset_start: 2
  stats:
    post:
      - name: "nstat"
        run: "nstat"
      - name: "mptcp"
        run: "ip mptcp endpoint show; ip mptcp limits show"
    pre:
      - name: "nstat"
        run: "nstat -n"
  timeout_s: 900
name: "sched-mem-pressure"
tests:
  - bridges:
      - delay_ms: 10
        max_latency_ms: 30
        name: "br0"
        rate_mbit: 100
      - delay_ms: 15
        max_latency_ms: 985
        name: "br1"
        rate_mbit: 10
    name: "bloated_slow_secondary receiver_tcp_mem parallel=1"
    regression:
      global:
        history_max_n: 50
      steps:
        - file: "stats/dstat.json"
          json_field:
            - "client"
            - "net/eth0:recv"
            - "mean"
          name: "Receiver primary path"
        - file: "stats/dstat.json"
          json_field:
            - "client"
            - "net/eth1:recv"
            - "mean"
          name: "Receiver secondary path"
        - file: "stats/dstat.json"
          json_field:
            - "client"
            - "net/total:recv"
            - "mean"
          name: "Receiver total"
        - file: "artifacts/iperf_cli.json"
          json_field:
            - "end"
            - "sum_received"
            - "bits_per_second"
          name: "iperf3 received"
    steps:
      - client: "ip mptcp limits set subflows 2 add_addr_accepted 2"
        name: "mptcp endpoints"
        server: "ip mptcp endpoint add 10.0.1.3 dev eth1 signal"
      - client: |
          sysctl -qw net.ipv4.tcp_rmem="4096 131072 6000000"
          sysctl -qw net.ipv4.tcp_mem="1000 2000 10000"
        name: "sysctls"
      - name: "iperf3 server"
        server: |
          iperf3 -s -D
          port=":$(printf "%04X" "5201") 0A"; while true; do awk '{print $2" "$4}' /proc/net/tcp* | grep -q "${port}" && break; done
        timeout_s: 10
      - all: "(sleep 30; ss -Mtni > \"${RESULTS_DIR}/artifacts/ss_${HOSTNAME}.txt\") & disown"
        name: "ss"
      - client: "iperf3 -c 10.0.0.3 --mptcp -Z --json -t 60 -R > \"${RESULTS_DIR}/artifacts/iperf_cli.json\""
        dstat_only: "step"
        name: "iperf3 client"
        timeout_s: 120
    validation:
      - name: "transfer"
        run: |
          set -x
          [ -s artifacts/iperf_cli.json ]
          cd stats
          [ "$(jq -r '.host.time.diff' dstat.json || echo 0)" -ge 36 ]
          [ "$(jq -r '.host.time.diff' dstat.json || echo 0)" -le 65 ]
          [ "$(jq -r '.client["net/total:recv"].mean | round' dstat.json || echo 0)" -ge 1200000 ]
